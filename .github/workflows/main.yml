name: Google Voice Keep Alive & Auto Log

on:
  schedule:
    # Runs at 00:00 UTC on the 1st of every month (08:00 Beijing Time)
    - cron: '0 0 1 * *'
  workflow_dispatch: # Allows manual triggering for testing

permissions:
  contents: write

concurrency:
  group: google-voice-keep-alive
  cancel-in-progress: false

jobs:
  keep-alive-job:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Fetches full history to allow branch switching

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'

      - name: Run Python Script (Send SMS)
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          GV_GATEWAY: ${{ secrets.GV_GATEWAY }}
        run: python main.py

      - name: Prepare keepalive log commit
        id: log_prepare
        run: |
          # 1. Configure Git Identity
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # 2. Create or switch to the 'logs' branch
          # This ensures that log updates don't clutter the main branch for forkers
          git checkout logs 2>/dev/null || git checkout -b logs

          # 3. Update the log file
          echo "Run at $(date -u) UTC" >> keepalive.log

          # 4. Commit locally; publication happens after the secret scan
          git add keepalive.log
          git commit -m "chore: update keepalive log [skip ci]" || echo "No changes to commit"

      - name: Scan the keepalive log before publishing
        id: log_scan
        uses: QuantStrategyLab/.github/actions/scan-before-publish@0da4da68433b803cda17d3f84e29875a94a32273
        with:
          path: keepalive.log

      - name: Push keepalive log to the logs branch
        if: steps.log_scan.outcome == 'success'
        run: git push origin logs
