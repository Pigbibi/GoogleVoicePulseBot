name: Google Voice Keep Alive & Auto Log

on:
  schedule:
    # Runs at 00:00 UTC on the 1st of every month (08:00 Beijing Time)
    - cron: '0 0 1 * *'
  workflow_dispatch: # Allows manual triggering for testing

permissions:
  contents: read

concurrency:
  group: google-voice-keep-alive
  cancel-in-progress: false

jobs:
  keep-alive-job:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Fetches full history to allow branch switching

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'

      - name: Run Python Script (Send SMS)
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          GV_GATEWAY: ${{ secrets.GV_GATEWAY }}
        run: python main.py

      - name: Record last success time
        if: success()
        run: |
          printf 'Last success: %s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_STEP_SUMMARY"
